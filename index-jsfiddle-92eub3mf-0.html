<!DOCTYPE html>
<html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversion Scrimba Project</title>

  <style>
    * {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Inter", Helvetica, Arial, sans-serif;
  background-color: #f4f4f4;
  padding-bottom: 20px;
}

/* ---------- Purple header (title + input + button) ---------- */

#title {
  margin: 0;
  padding: 40px 20px 30px;
  background-color: #5f3dfa;
  color: white;
  font-size: 28px;
  font-weight: 800;
  text-align: center;
}

#container {
  background-color: #5f3dfa;
  padding: 0 20px 40px;
  text-align: center;
}

#number {
  display: block;
  margin: 0 auto 30px;
  width: 100px;
  height: 70px;
  background-color: transparent;
  border: 2px solid rgba(255, 255, 255, 0.3);
  color: white;
  font-family: inherit;
  font-size: 48px;
  font-weight: 800;
  text-align: center;
  outline: none;
}

#number::placeholder {
  color: rgba(255, 255, 255, 0.4);
}

#number:focus {
  border-color: white;
}

#convert-btn {
  display: block;
  margin: 0 auto;
  width: 105px;
  height: 38px;
  background-color: white;
  color: #1f2937;
  border: none;
  border-radius: 4px;
  font-family: inherit;
  font-size: 16px;
  cursor: pointer;
}

#convert-btn:hover {
  background-color: #e8e4ff;
}

/* ---------- White result cards ---------- */

#length-container,
#volume-container,
#mass-container {
  background-color: white;
  margin: 20px 24px;
  padding: 24px 16px;
  text-align: center;
}

#length-container:first-of-type {
  margin-top: 30px;
}

#length-title,
#volume-title,
#mass-title {
  margin: 0 0 12px;
  color: #5a4b81;
  font-size: 20px;
  font-weight: 600;
}

#length-result,
#volume-result,
#mass-result {
  margin: 0;
  color: #1f2937;
  font-size: 14px;
}
  </style>

  
</head>
<body>
  <h1 id="title">Metric/Imperoal Unit Conversion</h1>

<div id="container">
 <!-- <input type="number" name="number" id="number">
  <button id="convert-btn">Convert</button> -->
</div>

<div id="length-container">

</div>

<div id="volume-container">

</div>

<div id="mass-container">

</div>

  <script>
    let container = document.getElementById("container");
let lengthContainer = document.getElementById("length-container");
let volumeContainer = document.getElementById("volume-container");
let massContainer = document.getElementById("mass-container");
const meterToFeet = 3.281;
const litreToGallon = 0.264;
const kgToPound = 2.204;

// 1. Create all the elements first
container.innerHTML = `<input type="number" name="number" id="number">
  <button id="convert-btn">Convert</button>`;

lengthContainer.innerHTML = `<h2 id="length-title">Length Meter/Feet</h2>
<p id="length-result"></p>`;

volumeContainer.innerHTML = `<h2 id="volume-title">Volume Litres/Gallons</h2>
<p id="volume-result"></p>`;

massContainer.innerHTML = `<h2 id="mass-title">Mass Kilograms/Pounds</h2>
<p id="mass-result"></p>`;

// 2. Then grab them, now that they exist
let number = document.getElementById("number");
let convertBtn = document.getElementById("convert-btn");
let lengthResult = document.getElementById("length-result");
let volumeResult = document.getElementById("volume-result");
let massResult = document.getElementById("mass-result");

// 3. Then add the click behaviour
convertBtn.addEventListener("click", function () {
  if (number.value === "") return;

  let num = Number(number.value);

  lengthResult.textContent = `${num} meters = ${(num * meterToFeet).toFixed(3)} feet | ` + `${num} feet = ${(num / meterToFeet).toFixed(3)} meters`;

  volumeResult.textContent = `${num} litres = ${(num * litreToGallon).toFixed(3)} gallons | ` + `${num} gallons = ${(num / litreToGallon).toFixed(3)} litres`;

  massResult.textContent = `${num} kilograms = ${(num * kgToPound).toFixed(3)} pounds | ` + `${num} pounds = ${(num / kgToPound).toFixed(3)} kilograms`;
});
  </script>
</body>
</html>
